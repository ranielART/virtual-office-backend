version: "3.8"

networks:
  postgres-net:
    driver: bridge

services:
  postgres:
    image: postgres:17
    container_name: postgres
    networks:
      - postgres-net
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=CHANGE_ME
      - POSTGRES_DB=vobsb_dev
    volumes:
      - ./data:/var/lib/postgresql/data
