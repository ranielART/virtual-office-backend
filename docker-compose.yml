version: '3.8'

networks:
  postgres-net:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    networks:
      - postgres-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: CHANGE_ME
    volumes:
      - postgres_data:/var/lib/postgresql/data